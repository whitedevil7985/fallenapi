name: Avyra Heroku Container Deploy
on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: Heroku API key secret name
        required: true
        type: string
      app_name:
        description: Heroku app name
        required: true
        type: string
      process_type:
        description: Heroku process type
        required: true
        type: choice
        options: [web, worker]
      quantity:
        description: Number of dynos
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check Dockerfile
        run: test -f Dockerfile || (echo "Dockerfile not found in repository root" && exit 1)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Heroku Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets[inputs.secret_name] }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.heroku.com/${{ github.event.inputs.app_name }}/${{ github.event.inputs.process_type }}
      - name: Release container
        env:
          HEROKU_API_KEY: ${{ secrets[inputs.secret_name] }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          PROCESS_TYPE: ${{ github.event.inputs.process_type }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          QUANTITY: ${{ github.event.inputs.quantity }}
        run: |
          curl --fail-with-body --silent --show-error -X PATCH "https://api.heroku.com/apps/${APP_NAME}/formation" \
            -H "Authorization: Bearer ${HEROKU_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            --data "{\"updates\":[{\"type\":\"${PROCESS_TYPE}\",\"docker_image\":\"${IMAGE_DIGEST}\",\"quantity\":${QUANTITY}}]}"
